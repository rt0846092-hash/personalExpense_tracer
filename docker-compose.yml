version: "3.9"

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tracker
      MYSQL_USER: tracker_user
      MYSQL_PASSWORD: tracker_pass
      MYSQL_ROOT_PASSWORD: tracker_root_pass
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - tracker_mysqldata:/var/lib/mysql

volumes:
  tracker_mysqldata:
